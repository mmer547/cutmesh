# Unit tests with the Rust extension built, on Linux and Windows.
# numpy / scipy are pinned to the versions the tests were written against: several
# tests check that the Rust kernels add in NumPy's order, bit for bit.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install the Python packages
        run: python -m pip install numpy==2.4.6 scipy==1.17.1 matplotlib==3.11.2

      - name: Build the Rust extension
        run: python tools/build_rust.py

      - name: Check that the extension loads
        run: python -c "import cutmesh.geometry as g; assert g.rust_available(), 'Rust extension not loaded'"

      - name: Tests
        run: python -m unittest discover -s tests
