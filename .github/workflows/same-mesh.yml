# Does a pull request change the meshes?  Builds the base branch and the pull request on
# the same runner and meshes the stirred-tank examples and the showcase suite with both
# (benchmark/same_mesh.py); fails when a mesh differs.  Mesh files depend on the machine,
# so both sides are made here instead of comparing with stored hashes.
# A pull request that changes meshes on purpose: give it the label "mesh-change" (and say so
# in the pull request); the differences are still listed in the log and the job summary, but
# the check passes.  Adding or removing the label runs the check again.
name: same mesh

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: same-mesh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  same-mesh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: head

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            base/rust
            head/rust

      - name: Install the Python packages
        run: python -m pip install numpy==2.4.6 scipy==1.17.1 matplotlib==3.11.2

      - name: Build the Rust extension (base and pull request)
        run: |
          python base/tools/build_rust.py
          python head/tools/build_rust.py

      - name: Mesh with both and compare
        id: compare
        continue-on-error: ${{ contains(github.event.pull_request.labels.*.name, 'mesh-change') }}
        run: python head/benchmark/same_mesh.py base head --out same_mesh_out | tee same_mesh_out.txt; exit ${PIPESTATUS[0]}

      - name: Summary
        if: always()
        run: |
          {
            if [ "${{ steps.compare.outcome }}" = "failure" ]; then
              echo "### Meshes differ from the base branch (label mesh-change: intended)"
            fi
            echo '```'
            tail -n 25 same_mesh_out.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: same-mesh-logs
          path: same_mesh_out/**/*.log
          if-no-files-found: ignore
