# Wheels with the Rust extension built in (maturin, abi3: one wheel per platform for every
# Python from 3.9), and the sdist.  Each wheel is installed and meshes an example on its own
# platform.  A tag v* (e.g. v0.9.0) attaches them to a GitHub release of that tag; cutmesh is
# not published on PyPI.
name: wheels

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "rust/**"
      - "pyproject.toml"
      - ".github/workflows/wheels.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, test: true }
          - { os: ubuntu-latest, target: aarch64, test: false }
          - { os: windows-latest, target: x64, test: true }
          - { os: macos-14, target: aarch64, test: true }
          - { os: macos-14, target: x86_64, test: false }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
          rust-toolchain: stable

      - name: Install the wheel and mesh an example
        if: matrix.test
        shell: bash
        run: |
          python -m pip install dist/*.whl
          cd examples/stirred_tank
          python -c "import cutmesh, cutmesh.geometry as g; print('cutmesh', cutmesh.__version__, 'from', cutmesh.__file__); assert 'site-packages' in cutmesh.__file__; assert g.rust_available(), 'Rust extension not loaded'"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            python -c "import cutmesh, sys; t = sys.argv[1]; assert t == 'v' + cutmesh.__version__, (t, cutmesh.__version__)" "${GITHUB_REF#refs/tags/}"
          fi
          cutmesh --version
          cutmesh meshDict.json -case case_wheel

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheel, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach the wheels and the sdist to the release of the tag
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
