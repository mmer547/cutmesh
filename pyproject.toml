[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cutmesh"
dynamic = ["version"]
description = "Octree cut-cell mesher for OpenFOAM: polyhedral meshes inside watertight STLs, with rotating zones cut into the mesh (cellZone + interface faceZone), cylindrical base meshes and boundary layers. Python, optional Rust extension (prototype)."
requires-python = ">=3.9"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
plot = ["matplotlib"]

[project.scripts]
cutmesh = "cutmesh.__main__:main"

[tool.setuptools]
packages = ["cutmesh"]

[tool.setuptools.dynamic]
version = {attr = "cutmesh.__version__"}

[tool.setuptools.package-data]
cutmesh = ["_core*.pyd", "_core*.so"]
