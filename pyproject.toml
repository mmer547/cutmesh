[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cutmesh"
version = "0.1.0"
description = "Octree cut-cell mesher for OpenFOAM: STL interior + rotating (MRF) cylinder zones"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
plot = ["matplotlib"]

[project.scripts]
cutmesh = "cutmesh.__main__:main"

[tool.setuptools]
packages = ["cutmesh"]

[tool.setuptools.package-data]
cutmesh = ["_core*.pyd", "_core*.so"]
