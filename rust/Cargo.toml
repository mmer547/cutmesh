[package]
name = "cutmesh_core"
version = "0.1.0"
edition = "2024"
description = "Fast geometry queries for cutmesh (closest point, inside test, signed distance)"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
numpy = "0.30.0"
pyo3 = { version = "0.30.1", features = ["extension-module"] }
rayon = "1.12.0"

[profile.release]
opt-level = 3
codegen-units = 1
