[package]
name = "cutmesh_core"
version = "1.0.0"
edition = "2024"
license = "MIT"
rust-version = "1.88" # slice::as_chunks
description = "Fast geometry queries for cutmesh (closest point, inside test, signed distance)"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
numpy = "0.30.0"
# abi3: one extension (and one wheel per platform) for every Python from 3.9
pyo3 = { version = "0.30.1", features = ["extension-module", "abi3-py39"] }
rayon = "1.12.0"

[profile.release]
opt-level = 3
codegen-units = 1
